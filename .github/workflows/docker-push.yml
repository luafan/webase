name: Docker Push

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  check-changes:
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule'
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check for commits in the past week
      id: check
      run: |
        if git log --since="7 days ago" --oneline | grep -q .; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

  push:
    runs-on: ubuntu-22.04
    needs: [check-changes]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        github.event_name == 'schedule' && needs.check-changes.outputs.has_changes == 'true'
      )

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Generate version tag
      run: echo APP_VERSION=`git describe --tags --always` >> $GITHUB_ENV

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          luafan/webase:latest
          luafan/webase:${{ env.APP_VERSION }}
